
name: Publish Docker Image

on:
  push:
    branches:
      - master  # Run this workflow when pushing to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # Allow writing to GHCR
      contents: read  # Allow reading repo contents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/my-app:latest .
          docker tag ghcr.io/${{ github.repository_owner }}/my-app:latest ghcr.io/${{ github.repository_owner }}/my-app:${{ github.sha }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/my-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/my-app:${{ github.sha }}

